services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redbull
      POSTGRES_USER: redbull
      POSTGRES_PASSWORD: redbull
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redbull -d redbull"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redbull_test
      POSTGRES_USER: redbull
      POSTGRES_PASSWORD: redbull
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redbull -d redbull_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
